<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>HLS Stream Downloader — Open Media Downloader</title>
  <link rel="stylesheet" href="hls.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <header class="topbar">
        <div>
          <h1>HLS Stream Downloader</h1>
          <p class="description">
            Сборка и сохранение HLS-потока
          </p>
        </div>

        <button id="closeButton" class="close-button" type="button" title="Закрыть">
          ×
        </button>
      </header>

      <div class="url-box">
        <div class="label">Источник:</div>
        <div id="sourceUrl" class="source-url">—</div>
      </div>

      <div id="qualityControls" class="quality-controls" hidden>
        <label class="label" for="variantSelect">Качество:</label>

        <select id="variantSelect" class="quality-select"></select>

        <label class="label output-mode-label" for="outputModeSelect">Формат сохранения:</label>
        <select id="outputModeSelect" class="quality-select">
          <option value="original">Исходный формат</option>
          <option value="mp3">MP3 (beta)</option>
        </select>

        <div class="actions">
          <button id="downloadButton" class="primary-button" type="button" disabled>
            Скачать выбранное
          </button>

          <button id="cancelDownloadButton" class="secondary-button" type="button" hidden>
            Отменить
          </button>
        </div>
      </div>
      <div class="progress-wrap">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <p id="status" class="status">Подготовка...</p>

      <div id="details" class="details"></div>
    </section>
  </main>

  <script type="module" src="modules/index.js"></script>
</body>
</html>
