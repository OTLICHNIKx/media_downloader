<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Media Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <div class="header">
      <div>
        <h1>Media Downloader</h1>
        <p id="siteHost" class="site-host">Текущий сайт</p>
      </div>
    </div>

    <label class="toggle-row">
      <span class="toggle-text">
        <span class="toggle-title">Отключить на этом сайте</span>
        <span class="toggle-subtitle">Скрыть кнопки скачивания</span>
      </span>

      <input id="siteToggle" class="toggle-input" type="checkbox">
      <span class="toggle-visual"></span>
    </label>

    <p id="status" class="status"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
