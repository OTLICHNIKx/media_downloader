<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>OTLICHNIK Media Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="hero">
      <div class="brand-mark" aria-hidden="true">
        <span></span>
      </div>
      <div class="brand-copy">
        <p class="eyebrow">OTLICHNIK Media Downloader</p>
        <h1>Медиа на этой странице</h1>
        <p id="siteHost" class="site-host">Текущий сайт</p>
      </div>
    </header>

    <section class="status-card" aria-label="Состояние расширения">
      <div>
        <span class="status-label">Состояние</span>
        <p id="status" class="status"></p>
      </div>
      <button id="openPanelButton" class="panel-button" type="button">
        Открыть панель
      </button>
    </section>

    <label class="toggle-row">
      <span class="toggle-text">
        <span class="toggle-title">Скрыть кнопки на этом сайте</span>
        <span class="toggle-subtitle">Логика поиска останется доступной в панели</span>
      </span>
      <input id="siteToggle" class="toggle-input" type="checkbox">
      <span class="toggle-visual"></span>
    </label>

    <section class="popup-section streams-section">
      <div class="section-header">
        <div>
          <span class="section-kicker">Streams</span>
          <h2>Найденные потоки <span id="streamsCounter" class="counter">0</span></h2>
        </div>
        <button id="refreshButton" class="small-button" type="button">Обновить</button>
      </div>

      <div class="stream-filters" aria-label="Фильтры потоков">
        <button class="filter-chip active" type="button" data-stream-filter="all">Все</button>
        <button class="filter-chip" type="button" data-stream-filter="audio">Audio</button>
        <button class="filter-chip" type="button" data-stream-filter="video">Video</button>
        <button class="filter-chip" type="button" data-stream-filter="stream">Stream</button>
      </div>

      <div id="streamsList" class="list-box empty">
        Пока ничего не найдено. Запусти воспроизведение на странице и обнови popup.
      </div>
    </section>

    <details class="popup-section diagnostics-section">
      <summary class="details-header">
        <span>
          <span class="section-kicker">Developer</span>
          <strong>Диагностика</strong>
        </span>
        <span class="details-chevron" aria-hidden="true">⌄</span>
      </summary>

      <div class="details-body">
        <button id="clearButton" class="small-button secondary" type="button">Очистить диагностику</button>
        <div id="diagnosticsList" class="list-box empty">
          Диагностики пока нет.
        </div>
      </div>
    </details>
  </main>

  <script type="module" src="modules/index.js"></script>
</body>
</html>
