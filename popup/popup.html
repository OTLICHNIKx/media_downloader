<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Media Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <div class="header">
      <div>
        <h1>Media Downloader</h1>
        <p id="siteHost" class="site-host">Текущий сайт</p>
      </div>

      <button id="openPanelButton" class="panel-button" type="button">
        Панель
      </button>
    </div>

    <label class="toggle-row">
      <span class="toggle-text">
        <span class="toggle-title">Отключить на этом сайте</span>
        <span class="toggle-subtitle">Скрыть кнопки скачивания</span>
      </span>

      <input id="siteToggle" class="toggle-input" type="checkbox">
      <span class="toggle-visual"></span>
    </label>

    <p id="status" class="status"></p>
        <section class="popup-section">
      <div class="section-header">
        <h2>Найденные потоки</h2>
        <button id="refreshButton" class="small-button" type="button">Обновить</button>
      </div>

      <div id="streamsList" class="list-box empty">
        Пока ничего не найдено. Запусти воспроизведение на странице и обнови popup.
      </div>
    </section>

    <section class="popup-section">
      <div class="section-header">
        <h2>Диагностика</h2>
        <button id="clearButton" class="small-button" type="button">Очистить</button>
      </div>

      <div id="diagnosticsList" class="list-box empty">
        Диагностики пока нет.
      </div>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
